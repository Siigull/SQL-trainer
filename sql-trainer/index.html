<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Trainer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --sidebar-bg: #1e293b;
      --sidebar-fg: #cbd5e1;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --error: #dc2626;
      --warn: #ca8a04;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background: var(--bg); color: var(--text); }
    #app { display: flex; height: 100vh; overflow: hidden; }
    aside { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-fg); display: flex; flex-direction: column; overflow: hidden; }
    aside h1 { margin: 0; padding: 16px; font-size: 18px; border-bottom: 1px solid #334155; }
    .search { padding: 10px 14px 4px; }
    .search input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
    .randbar { padding: 6px 14px 10px; }
    .randbar button { width: 100%; padding: 8px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; }
    .randbar button:hover { background: var(--accent-hover); }
    .qlist { flex: 1; overflow-y: auto; padding: 8px; }
    .group { margin-bottom: 8px; }
    .group-title { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 10px 4px; color: #94a3b8; }
    .qitem { padding: 8px 10px; margin: 2px 0; border-radius: 8px; cursor: pointer; font-size: 13px; line-height: 1.35; }
    .qitem:hover { background: #334155; }
    .qitem.active { background: var(--accent); color: #fff; }
    .qitem .tag { font-size: 11px; opacity: 0.8; margin-top: 2px; }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    header h2 { margin: 0; font-size: 16px; }
    .pills { display: flex; gap: 8px; }
    .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h3 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .assignment { font-size: 15px; line-height: 1.6; }
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .tab { padding: 8px 14px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; }
    .tab.active { background: var(--card-bg); border-bottom-color: var(--card-bg); font-weight: 700; }
    .editor { display: flex; flex-direction: column; gap: 8px; }
    textarea { width: 100%; min-height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); resize: vertical; }
    .btn { padding: 8px 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
    .btn:hover { background: var(--accent-hover); }
    .btn.secondary { background: #e2e8f0; color: var(--text); }
    .btn.secondary:hover { background: #cbd5e1; }
    .actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: var(--bg); font-weight: 600; }
    tr:nth-child(even) td { background: #f8fafc; }
    .schema { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .schema-table { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .schema-title { background: var(--bg); padding: 8px 10px; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--border); }
    .schema-row { padding: 6px 10px; font-size: 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
    .schema-row:last-child { border-bottom: none; }
    .pk { color: var(--accent); font-weight: 700; }
    .fk { color: var(--warn); }
    .hint-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px; }
    .hint-box pre { margin: 0; font-family: ui-monospace, monospace; font-size: 13px; overflow-x: auto; }
    .result-box { margin-top: 10px; }
    .status { padding: 10px 12px; border-radius: 8px; font-weight: 600; margin-bottom: 10px; font-size: 13px; }
    .status.ok { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
    .status.err { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
    .status.info { background: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; }
    .hidden { display: none; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
    .loading { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<div id="app">
  <aside>
    <h1>🛠️ SQL Trainer</h1>
    <div class="search"><input id="search" placeholder="Search questions..."></div>
    <div class="randbar"><button onclick="pickRandomQuestion()">🎲 Random Question</button></div>
    <div class="qlist" id="qlist"></div>
  </aside>
  <main>
    <header>
      <h2 id="qtitle">Select a question</h2>
      <div class="pills" id="qpills"></div>
    </header>
    <div class="content" id="content">
      <div class="card">
        <div class="assignment">Choose a question from the sidebar to begin training.</div>
      </div>
    </div>
  </main>
</div>

// ================== APP STATE ==================
let SQL = null;
let currentDb = null;
let currentQuestion = null;
let expectedResults = new Map(); // question id -> result object

// ================== HELPERS ==================
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function resultToTable(res) {
  if (!res || !res.length) return '<p style="color:var(--muted)"><em>No rows.</em></p>';
  const cols = Object.keys(res[0]);
  let html = '<table><thead><tr>' + cols.map(c => `<th>${escapeHtml(c)}</th>`).join('') + '</tr></thead><tbody>';
  for (const row of res) {
    html += '<tr>' + cols.map(c => `<td>${escapeHtml(row[c] ?? 'NULL')}</td>`).join('') + '</tr>';
  }
  html += '</tbody></table>';
  return html;
}
function resultFromStmt(stmt) {
  const res = [];
  const cols = stmt.getColumnNames();
  const seen = new Map();
  const uniqueCols = cols.map(c => {
    const count = seen.get(c) || 0;
    seen.set(c, count + 1);
    return count === 0 ? c : c + '_' + count;
  });
  while (stmt.step()) {
    const obj = {};
    const row = stmt.get();
    for (let i = 0; i < uniqueCols.length; i++) obj[uniqueCols[i]] = row[i];
    res.push(obj);
  }
  stmt.free();
  return res;
}
function execSql(db, sql) {
  // Remove trailing semicolon for sql.js prepare compatibility if needed, but sql.js usually handles it
  sql = sql.trim();
  // Only run first statement for safety in the app
  const first = sql.split(';')[0] + ';';
  const stmt = db.prepare(first);
  const res = resultFromStmt(stmt);
  return res;
}
function getDb(datasetKey) {
  const db = new SQL.Database();
  const init = datasets[datasetKey].init;
  db.exec(init);
  return db;
}
function computeExpected(q) {
  if (q.executable === false) return null;
  const db = getDb(q.dataset);
  try {
    const res = execSql(db, q.hint);
    db.close();
    return { rows: res, ok: true };
  } catch (e) {
    db.close();
    return { error: e.message, ok: false };
  }
}
function resultsEqual(a, b) {
  if (!a || !b) return false;
  if (a.length !== b.length) return false;
  if (a.length === 0) return true;
  const colsA = Object.keys(a[0]).sort();
  const colsB = Object.keys(b[0]).sort();
  if (colsA.length !== colsB.length) return false;
  for (let i = 0; i < colsA.length; i++) if (colsA[i] !== colsB[i]) return false;
  const canon = (rows) => {
    return rows.map(r => colsA.map(k => {
      const v = r[k];
      if (v == null) return 'NULL';
      if (typeof v === 'number') return Number(v).toFixed(4);
      return String(v);
    }).join('|')).sort();
  };
  const ca = canon(a);
  const cb = canon(b);
  for (let i = 0; i < ca.length; i++) if (ca[i] !== cb[i]) return false;
  return true;
}

// ================== UI ==================
function renderSidebar(filter='') {
  const qlist = document.getElementById('qlist');
  qlist.innerHTML = '';
  const groups = {};
  for (const q of questions) {
    if (filter) {
      const hay = (q.title + ' ' + q.tags.join(' ') + ' ' + datasets[q.dataset]?.name).toLowerCase();
      if (!hay.includes(filter.toLowerCase())) continue;
    }
    const g = datasets[q.dataset]?.name || 'Theory';
    if (!groups[g]) groups[g] = [];
    groups[g].push(q);
  }
  for (const g of Object.keys(groups).sort()) {
    const div = document.createElement('div'); div.className = 'group';
    const t = document.createElement('div'); t.className = 'group-title'; t.textContent = g; div.appendChild(t);
    for (const q of groups[g]) {
      const item = document.createElement('div');
      item.className = 'qitem' + (currentQuestion?.id === q.id ? ' active' : '');
      item.innerHTML = `<div>${escapeHtml(q.title)}</div><div class="tag">${q.tags.map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join(' ')}</div>`;
      item.onclick = () => selectQuestion(q);
      div.appendChild(item);
    }
    qlist.appendChild(div);
  }
}

function pickRandomQuestion() {
  const pool = questions.filter(q => q.executable !== false);
  let next;
  if (pool.length <= 1) { next = pool[0]; }
  else {
    do { next = pool[Math.floor(Math.random() * pool.length)]; }
    while (currentQuestion && next.id === currentQuestion.id);
  }
  if (next) {
    document.getElementById('search').value = '';
    renderSidebar('');
    selectQuestion(next);
  }
}

function selectQuestion(q) {
  currentQuestion = q;
  renderSidebar(document.getElementById('search').value);
  document.getElementById('qtitle').textContent = q.title;
  const pills = document.getElementById('qpills');
  pills.innerHTML = `<span class="pill">${escapeHtml(datasets[q.dataset]?.name || 'Theory')}</span>` +
    q.tags.map(t => `<span class="pill">${escapeHtml(t)}</span>`).join('');

  const content = document.getElementById('content');
  const isTheory = q.executable === false;

  let html = `
    <div class="card">
      <h3>Assignment</h3>
      <div class="assignment">${escapeHtml(q.text)}</div>
    </div>
  `;

  if (!isTheory) {
    html += `
      <div class="card">
        <h3>Dataset schema</h3>
        <div class="schema" id="schema"></div>
      </div>
      <div class="card">
        <h3>Dataset data</h3>
        <div id="dataTabs" class="tabs">
          ${Object.keys(datasets[q.dataset].schema).map((t,i)=>`<button class="tab ${i===0?'active':''}" onclick="showDataTab('${t}')">${t}</button>`).join('')}
        </div>
        <div id="dataPanel"></div>
      </div>
      <div class="card">
        <h3>Your SQL</h3>
        <div class="editor">
          <textarea id="userSql" placeholder="Write your SQL query here...">${localStorage.getItem('sql_' + q.id) || ''}</textarea>
          <div class="actions">
            <button class="btn" onclick="runUserSql()">▶ Run SQL</button>
            <button class="btn secondary" onclick="showHint()">💡 Show Hint</button>
            <button class="btn secondary" onclick="resetQuestion()">Reset</button>
          </div>
        </div>
      </div>
      <div class="card hidden" id="resultCard">
        <h3>Your Result</h3>
        <div id="userResult" class="result-box"></div>
        <div id="userStatus"></div>
      </div>
      <div class="card hidden" id="expectedCard">
        <h3>Expected Result</h3>
        <div id="expectedResult" class="result-box"></div>
      </div>
      <div class="card hidden" id="hintCard">
        <h3>Hint</h3>
        <div class="hint-box"><pre>${escapeHtml(q.hint)}</pre></div>
      </div>
    `;
  } else {
    html += `
      <div class="card">
        <h3>Hint / Answer</h3>
        <div class="hint-box"><pre>${escapeHtml(q.hint)}</pre></div>
      </div>
    `;
  }

  content.innerHTML = html;

  if (!isTheory) {
    renderSchema(q.dataset);
    showDataTab(Object.keys(datasets[q.dataset].schema)[0]);
    if (!expectedResults.has(q.id)) {
      expectedResults.set(q.id, computeExpected(q));
    }
  }
}

function renderSchema(key) {
  const el = document.getElementById('schema');
  const s = datasets[key].schema;
  let html = '';
  for (const [tname, cols] of Object.entries(s)) {
    html += `<div class="schema-table">
      <div class="schema-title">${escapeHtml(tname)}</div>`;
    for (const c of cols) {
      if (c.constraint) {
        html += `<div class="schema-row"><span>${escapeHtml(c.constraint)}</span></div>`;
      } else {
        const badges = [];
        if (c.pk) badges.push('<span class="pk">PK</span>');
        if (c.fk) badges.push('<span class="fk">FK→'+escapeHtml(c.fk)+'</span>');
        if (c.notNull) badges.push('<span style="color:var(--error)">NOT NULL</span>');
        if (c.auto) badges.push('<span style="color:var(--success)">AUTO</span>');
        html += `<div class="schema-row"><span>${escapeHtml(c.name)} <span style="color:var(--muted)">${escapeHtml(c.type)}</span></span><span>${badges.join(' ')}</span></div>`;
      }
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

window.showDataTab = function(tableName) {
  document.querySelectorAll('#dataTabs .tab').forEach(t => t.classList.toggle('active', t.textContent === tableName));
  const db = getDb(currentQuestion.dataset);
  const res = execSql(db, `SELECT * FROM ${tableName} LIMIT 100`);
  db.close();
  document.getElementById('dataPanel').innerHTML = resultToTable(res);
};

window.runUserSql = function() {
  const sql = document.getElementById('userSql').value;
  if (!sql.trim()) return;
  localStorage.setItem('sql_' + currentQuestion.id, sql);
  const card = document.getElementById('resultCard');
  card.classList.remove('hidden');
  const db = getDb(currentQuestion.dataset);
  let res = [], cols = [], err;
  try {
    const first = sql.trim().split(';')[0] + ';';
    const stmt = db.prepare(first);
    cols = stmt.getColumnNames();
    const seen = new Map();
    const uniqueCols = cols.map(c => {
      const count = seen.get(c) || 0;
      seen.set(c, count + 1);
      return count === 0 ? c : c + '_' + count;
    });
    while (stmt.step()) {
      const obj = {};
      const row = stmt.get();
      for (let i = 0; i < uniqueCols.length; i++) obj[uniqueCols[i]] = row[i];
      res.push(obj);
    }
    stmt.free();
  } catch (e) { err = e.message; }
  db.close();

  const exp = expectedResults.get(currentQuestion.id);

  if (err) {
    document.getElementById('userResult').innerHTML = '';
    document.getElementById('userStatus').innerHTML = `<div class="status err">❌ Error: ${escapeHtml(err)}</div>`;
  } else if (cols.length === 0) {
    document.getElementById('userResult').innerHTML = '';
    document.getElementById('userStatus').innerHTML = `<div class="status info">ℹ️ Statement executed (no result set).<br>This app only checks SELECT queries.</div>`;
  } else {
    document.getElementById('userResult').innerHTML = resultToTable(res);
    if (exp && exp.ok && resultsEqual(res, exp.rows)) {
      document.getElementById('userStatus').innerHTML = `<div class="status ok">✅ Correct! Your result matches the expected output.</div>`;
    } else {
      document.getElementById('userStatus').innerHTML = `<div class="status info">ℹ️ Query executed. Compare with Expected Result below.<br><small>${res.length} row(s)</small></div>`;
    }
  }

  document.getElementById('expectedCard').classList.remove('hidden');
  if (exp && exp.ok) {
    document.getElementById('expectedResult').innerHTML = resultToTable(exp.rows);
  } else if (exp) {
    document.getElementById('expectedResult').innerHTML = `<div class="status err">Expected result compute error: ${escapeHtml(exp.error)}</div>`;
  }
};

window.showHint = function() {
  document.getElementById('hintCard').classList.remove('hidden');
};

window.resetQuestion = function() {
  localStorage.removeItem('sql_' + currentQuestion.id);
  selectQuestion(currentQuestion);
};

// ================== INIT ==================
initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` }).then(sql => {
  SQL = sql;
  renderSidebar();
  // Precompute all expected results in background
  for (const q of questions) {
    if (q.executable !== false && !expectedResults.has(q.id)) {
      try { expectedResults.set(q.id, computeExpected(q)); } catch(e) {}
    }
  }
}).catch(err => {
  document.getElementById('qlist').innerHTML = `<div style="padding:12px;color:#fca5a5">Failed to load sql.js: ${escapeHtml(err.message)}</div>`;
});

document.getElementById('search').addEventListener('input', e => renderSidebar(e.target.value));
</script>
